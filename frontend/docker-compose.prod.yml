services:
  frontend:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=replace-with-strong-secret
      - BACKEND_URL=http://host.docker.internal:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge 